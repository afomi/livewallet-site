url: "https://livewallet.app"
baseurl: "" # the subpath of your site, e.g. /blog
title: "LiveWallet"
description: "Learn Bitcoin by using Bitcoin with LiveWallet, a hands-on Elixir Livebook tutorial for creating wallets and exploring the Bitcoin SV ledger."
lang: "en-US"

